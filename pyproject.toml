[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-manager-innovaideia"
version = "2.0.0"
description = "Employee management API and desktop client"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "SQLAlchemy>=2.0,<3.0", "pydantic>=2.7,<3.0", "requests>=2.32,<3.0"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<0.29", "pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]
